name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dependencies
        run: flutter pub get
      - name: Build APK (universal)
        run: flutter build apk --release
      - name: Build APKs (split per ABI)
        run: flutter build apk --release --split-per-abi
      - name: Collect
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/Railynx-Android-v2.1.0.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/Railynx-Android-v2.1.0-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/Railynx-Android-v2.1.0-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk out/Railynx-Android-v2.1.0-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: railynx-android
          path: out/

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dependencies
        run: flutter pub get
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Build Windows
        run: flutter build windows --release
      - name: Zip
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Railynx-Windows-v2.1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: railynx-windows
          path: Railynx-Windows-v2.1.0.zip
